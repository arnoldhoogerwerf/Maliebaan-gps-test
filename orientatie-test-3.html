<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realistische Vloeistof Golven (Pixel-Metaballs)</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      background-color: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    #status {
      position: absolute; top: 15px; left: 15px;
      font-size: 11px; color: #aaa; z-index: 10;
      pointer-events: none; max-width: calc(100% - 180px);
    }

    button.start-btn {
      position: absolute; background: #00ffcc; color: #000;
      border: none; padding: 16px 30px; font-size: 16px;
      font-weight: bold; border-radius: 30px; z-index: 30;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); cursor: pointer;
    }

    #canvas-container {
      position: relative; width: 100vw; height: 100vw;
      max-width: 400px; max-height: 400px;
      display: flex; align-items: center; justify-content: center;
    }

    canvas {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #000;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div id="status">Druk op start voor de vloeistof-test.</div>
  <button class="start-btn" id="startBtn">Start Vloeistof Simulatie</button>

  <div id="canvas-container">
    <!-- Lage resolutie canvas (160x160) geüpscaled via CSS voor maximale iOS performance -->
    <canvas id="liquidCanvas" width="160" height="160"></canvas>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('liquidCanvas');
    const ctx = canvas.getContext('2d');

    const width = canvas.width;
    const height = canvas.height;
    const imgData = ctx.createImageData(width, height);
    const data = imgData.data;

    let time = 0;

    // Drie bewegende vloeistofbronnen (metaball centra)
    const sources = [
      { x: 80, y: 30, speed: 0.03, radius: 25 },
      { x: 40, y: 120, speed: 0.02, radius: 30 },
      { x: 120, y: 110, speed: 0.025, radius: 22 }
    ];

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      status.innerText = "Simulatie actief (Pixel-Metaballs)...";
      requestAnimationFrame(render);
    });

    function render() {
      time += 0.05;

      // Beweeg de bronnen lichtjes om samensmelting te demonstreren
      sources[0].x = 80 + Math.sin(time * 0.8) * 25;
      sources[0].y = 80 + Math.cos(time * 0.5) * 25;

      sources[1].x = 80 + Math.sin(time * 0.6 + 2) * 35;
      sources[1].y = 80 + Math.cos(time * 0.7 + 1) * 35;

      let index = 0;

      // Berekent veldsterkte per pixel
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          let sumField = 0;

          for (let i = 0; i < sources.length; i++) {
            const dx = x - sources[i].x;
            const dy = y - sources[i].y;
            const distSq = dx * dx + dy * dy;
            
            // Golffront + Metaball potentiële energie formule
            const wave = Math.sin(Math.sqrt(distSq) * 0.3 - time * 2);
            sumField += (sources[i].radius * sources[i].radius) / (distSq + 1) * (1 + 0.3 * wave);
          }

          // Drempelwaarde (thresholding) voor het harde vloeistof/samensmelt effect
          if (sumField > 0.8) {
            // Vloeistof binnenkant (Cyaan glow)
            data[index]     = 0;                   // R
            data[index + 1] = Math.min(255, sumField * 180); // G
            data[index + 2] = 204;                 // B
            data[index + 3] = 255;                 // Alpha
          } else if (sumField > 0.65) {
            // Rand/oppervlaktespanning
            data[index]     = 255; // Witte vloeistof-rand
            data[index + 1] = 255;
            data[index + 2] = 255;
            data[index + 3] = 255;
          } else {
            // Achtergrond
            data[index]     = 13;
            data[index + 1] = 13;
            data[index + 2] = 13;
            data[index + 3] = 255;
          }

          index += 4;
        }
      }

      ctx.putImageData(imgData, 0, 0);
      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
