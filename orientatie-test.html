<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRTF + Kompas Demo</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
    #compass { width: 150px; height: 150px; border: 2px solid #555; border-radius: 50%; margin: 50px auto; position: relative; }
    #arrow { width: 4px; height: 60px; background: #00ffcc; position: absolute; top: 15px; left: 73px; transform-origin: bottom center; }
  </style>
</head>
<body>

  <h2>Audio-Kompas Prototype</h2>
  <button id="startBtn">Start Audio & Kompas</button>
  
  <div id="compass">
    <div id="arrow"></div>
  </div>

  <script>
    let audioCtx, panner, soundSource;

    document.getElementById('startBtn').addEventListener('click', async () => {
      // 1. Vraag iOS kompas-toestemming
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }

      // 2. Start Web Audio Context
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Maak HRTF Panner
      panner = audioCtx.createPanner();
      panner.panningModel = 'HRTF';
      panner.distanceModel = 'inverse';

      // Maak een simpele ruis- of toon-bron (geen extern bestand nodig!)
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4 toon
      
      // Verbinden: Osc -> Panner -> Speakers
      osc.connect(panner);
      panner.connect(audioCtx.destination);
      osc.start();

      // 3. Luister naar kompas/oriëntatie
      window.addEventListener('deviceorientation', handleOrientation);
    });

    function handleOrientation(event) {
      // Haal kompasrichting op (iOS gebruikt webkitCompassHeading)
      let heading = event.webkitCompassHeading || (360 - event.alpha);
      
      // Update Visuele Pijl
      document.getElementById('arrow').style.transform = `rotate(${heading}deg)`;

      // Update HRTF Audio Positie (bereken x en z op een cirkel)
      if (panner && audioCtx) {
        let radians = heading * (Math.PI / 180);
        let x = Math.sin(radians);
        let z = -Math.cos(radians);
        
        // Zet de virtuele geluidsbron op positie (x, 0, z) rondom het hoofd
        panner.positionX.setValueAtTime(x, audioCtx.currentTime);
        panner.positionZ.setValueAtTime(z, audioCtx.currentTime);
      }
    }
  </script>
</body>
</html>
