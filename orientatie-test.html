<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Golffront Kompas (Gradiënt & Afstand)</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      background-color: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 25px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      padding: 0 20px;
      line-height: 1.4;
      z-index: 10;
      pointer-events: none;
    }

    button {
      position: absolute;
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 16px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      z-index: 20;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
      cursor: pointer;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vw;
      max-width: 500px;
      max-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div id="status">Druk op start om GPS & Kompas te activeren.</div>
  <button id="startBtn">Start Ervaring</button>

  <div id="canvas-container">
    <canvas id="compassCanvas" width="400" height="400"></canvas>
  </div>

  <script>
    let userCoords = null;
    let targetLocations = [];

    // Smoothing & Sensoren
    let rawHeading = 0;
    let smoothedHeading = 0;
    
    // Basis-kleur (Cyaan/Neon)
    const UNIFORM_COLOR = { r: 0, g: 255, b: 204 };

    let arrowData = [
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0 },
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0 },
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0 }
    ];

    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      // 1. iOS Kompas Toestemming
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            status.innerText = "Kompas-toestemming geweigerd.";
            return;
          }
        } catch (e) { console.error(e); }
      }

      // 2. Sensor Event Listeners
      window.addEventListener('deviceorientation', handleOrientation);

      if ("geolocation" in navigator) {
        status.innerText = "GPS zoeken...";
        navigator.geolocation.watchPosition(updatePosition, handleError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      } else {
        status.innerText = "Geen GPS ondersteuning.";
      }

      startBtn.style.display = 'none';

      // Start 60fps animatie loop
      requestAnimationFrame(renderLoop);
    });

    function updatePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!userCoords) {
        userCoords = { lat, lng };
        generateTargetLocations(lat, lng);
      } else {
        // Direct overnemen zonder trage smoothing voor snelle GPS-responsiviteit:
        userCoords.lat = lat;
        userCoords.lng = lng;
      }

      calculateTargets();
    }

    function handleError(err) {
      status.innerText = "GPS Fout: " + err.message;
    }

    // DYNAMISCHE GENERATIE: Elke refresh levert een unieke opstelling op!
    function generateTargetLocations(lat, lng) {
      targetLocations = [];
      
      // Willekeurige beginhoek voor wisselende windrichtingen
      const baseAngle = Math.random() * 360; 

      for (let i = 0; i < 3; i++) {
        // Spreid de bronnen rondom je locatie met willekeurige variaties
        const angle = baseAngle + (i * 120) + ((Math.random() - 0.5) * 60);

        // Willekeurige afstand per bron tussen 15 meter en 220 meter
        const distanceInMeters = Math.floor(15 + Math.random() * 205);
        
        const deltaLat = (distanceInMeters / 111111) * Math.cos(angle * Math.PI / 180);
        const deltaLng = (distanceInMeters / (111111 * Math.cos(lat * Math.PI / 180))) * Math.sin(angle * Math.PI / 180);

        targetLocations.push({ lat: lat + deltaLat, lng: lng + deltaLng });
      }
    }

    function calculateTargets() {
      if (!userCoords || targetLocations.length === 0) return;

      targetLocations.forEach((target, i) => {
        arrowData[i].targetDist = getDistance(userCoords.lat, userCoords.lng, target.lat, target.lng);
        arrowData[i].bearing = getBearing(userCoords.lat, userCoords.lng, target.lat, target.lng);
      });
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        rawHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        rawHeading = 360 - event.alpha;
      }
    }

    let animStep = 0;

    function renderLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const center = 200;
      const compassRadius = 195;

      // Clip alles tot het kompas
      ctx.save();
      ctx.beginPath();
      ctx.arc(center, center, compassRadius, 0, Math.PI * 2);
      ctx.clip();

      // Smooth Kompas Heading
      let diff = rawHeading - smoothedHeading;
      diff = Math.atan2(Math.sin(diff * Math.PI / 180), Math.cos(diff * Math.PI / 180)) * 180 / Math.PI;
      smoothedHeading += diff * 0.08;
      smoothedHeading = (smoothedHeading + 360) % 360;

      animStep += 0.2;

      if (userCoords && targetLocations.length > 0) {
        let statusText = "";

        targetLocations.forEach((target, i) => {
          // Smooth Afstand
          arrowData[i].currentDist += (arrowData[i].targetDist - arrowData[i].currentDist) * 0.05;
          const dist = arrowData[i].currentDist;

          // Smooth Rotatie met atan2 fix
          const targetAngle = arrowData[i].bearing - smoothedHeading;
          let angleDiff = targetAngle - arrowData[i].currentAngle;
          angleDiff = Math.atan2(Math.sin(angleDiff * Math.PI / 180), Math.cos(angleDiff * Math.PI / 180)) * 180 / Math.PI;
          arrowData[i].currentAngle += angleDiff * 0.1;

          // Teken ronde golfcirkels met helderheidsgradiënt naar afstand
          drawFullWaveCircles(ctx, arrowData[i].currentAngle, dist, center, compassRadius);

          statusText += `B${i+1}: ${Math.round(dist)}m | `;
        });

        status.innerText = statusText.slice(0, -3);
      }

      ctx.restore();

      // Buitenrand van het kompas
      ctx.save();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(center, center, compassRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    function drawFullWaveCircles(ctx, angleDeg, distanceMeters, center, compassRadius) {
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(angleDeg * Math.PI / 180);

      // Positie gebaseerd op de dynamische afstand
      const sourceY = -compassRadius - (distanceMeters * 3.2);

      const waveSpacing = 22; 
      const numWaves = 24;
      const timeOffset = (animStep) % waveSpacing;

      for (let r = 0; r < numWaves; r++) {
        const radius = Math.abs(sourceY) - compassRadius + (r * waveSpacing) + timeOffset;

        // GRADIËNT GRONDBINSDING:
        // Naarmate r groter wordt (golf reist verder af van de bron / komt dieper op de kaart),
        // verhogen of verlagen we de transparantie en streekdikte.
        // r = 0 is het verst van het centrum (minder helder) -> r = numWaves is het dichtst bij (volledig helder)
        const progress = r / numWaves; // Verloop van 0.0 naar 1.0
        
        // Kwadratisch verloop voor een natuurlijk visueel effect (fade-in)
        const alpha = Math.min(1.0, Math.max(0.08, Math.pow(progress, 1.8) * 0.95)); 
        const lineWidth = 0.8 + (progress * 1.6); // Dikkere lijnen dichtbij

        ctx.strokeStyle = `rgba(${UNIFORM_COLOR.r}, ${UNIFORM_COLOR.g}, ${UNIFORM_COLOR.b}, ${alpha})`;
        ctx.lineWidth = lineWidth;

        ctx.beginPath();
        ctx.arc(0, sourceY, radius, 0, Math.PI * 2, false);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Wiskundige functies
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
  </script>
</body>
</html>
