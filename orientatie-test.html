<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Golffront Kompas - Organische Pulsatie</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      background-color: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      overflow: hidden;
    }

    #status {
      position: absolute; top: 15px; left: 15px;
      font-size: 11px; color: #aaa; text-align: left;
      line-height: 1.3; z-index: 10; pointer-events: none;
      max-width: calc(100% - 180px); max-height: 120px; overflow: hidden;
    }

    .action-btn {
      position: absolute;
      border: none; padding: 12px 20px; font-size: 14px;
      font-weight: bold; border-radius: 25px; z-index: 30;
      cursor: pointer;
    }

    #startBtn {
      background: #00ffcc; color: #000;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
    }

    #triggerBtn {
      bottom: 25px; background: #ff3355; color: #fff;
      box-shadow: 0 0 15px rgba(255, 51, 85, 0.4);
      display: none;
    }

    #controls {
      position: absolute; top: 15px; right: 15px;
      background: rgba(20, 20, 20, 0.85); border: 1px solid #333;
      backdrop-filter: blur(8px); padding: 12px 16px;
      border-radius: 12px; z-index: 20; width: 220px;
      font-size: 11px; color: #ddd; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    #controls h3 {
      margin: 0 0 8px 0; font-size: 12px; color: #00ffcc;
      text-transform: uppercase; letter-spacing: 0.5px;
      display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    }

    .control-group { margin-bottom: 10px; }
    .control-group:last-child { margin-bottom: 0; }
    .control-group label { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .control-group input[type="range"] { width: 100%; accent-color: #00ffcc; cursor: pointer; }

    #canvas-container {
      position: relative; width: 100vw; height: 100vw;
      max-width: 500px; max-height: 500px;
      display: flex; align-items: center; justify-content: center;
    }

    canvas { width: 100%; height: 100%; border-radius: 50%; }
  </style>
</head>
<body>

  <div id="status">Druk op start om te beginnen.</div>
  <button class="action-btn" id="startBtn">Start Ervaring</button>
  <button class="action-btn" id="triggerBtn">Simuleer 5m Bereik (Bron 1)</button>

  <div id="controls">
    <h3 id="toggleControls"><span>Parameters</span> <span id="toggleIcon">−</span></h3>
    <div id="controlsBody">
      <div class="control-group">
        <label for="countInput"><span>Aantal Bronnen</span> <strong id="countVal">3</strong></label>
        <input type="range" id="countInput" min="1" max="12" value="3" step="1">
      </div>

      <div class="control-group">
        <label for="sampleLengthInput"><span>Sample Lengte</span> <strong id="sampleLengthVal">4.0s</strong></label>
        <input type="range" id="sampleLengthInput" min="0.5" max="15.0" value="4.0" step="0.5">
      </div>

      <div class="control-group">
        <label for="fadeTimeInput"><span>Fade Out Tijd</span> <strong id="fadeTimeVal">2.0s</strong></label>
        <input type="range" id="fadeTimeInput" min="0.1" max="10.0" value="2.0" step="0.5">
      </div>

      <div class="control-group">
        <label for="pulseSpeedInput"><span>Adem Snelheid</span> <strong id="pulseSpeedVal">2.5</strong></label>
        <input type="range" id="pulseSpeedInput" min="0.5" max="8.0" value="2.5" step="0.5">
      </div>

      <div class="control-group">
        <label for="spacingInput"><span>Lijnafstand</span> <strong id="spacingVal">45px</strong></label>
        <input type="range" id="spacingInput" min="10" max="60" value="45" step="1">
      </div>

      <div class="control-group">
        <label for="thicknessInput"><span>Lijndikte</span> <strong id="thicknessVal">1.0px</strong></label>
        <input type="range" id="thicknessInput" min="0.5" max="8.0" value="1.0" step="0.1">
      </div>

      <div class="control-group">
        <label for="exponentInput"><span>Gradiënt Curve</span> <strong id="exponentVal">4.0</strong></label>
        <input type="range" id="exponentInput" min="0.5" max="4.0" value="4.0" step="0.1">
      </div>

      <div class="control-group">
        <label for="speedInput"><span>Snelheid</span> <strong id="speedVal">0.020</strong></label>
        <input type="range" id="speedInput" min="0.0" max="1.0" value="0.02" step="0.005">
      </div>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="compassCanvas" width="400" height="400"></canvas>
  </div>

  <script>
    let config = {
      sourceCount: 3,
      sampleLengthSec: 4.0,
      fadeOutDurationSec: 2.0,
      pulseSpeed: 2.5,
      waveSpacing: 45,
      strokeWidth: 1.0,
      exponent: 4.0,
      animSpeed: 0.02
    };

    let userLat = null;
    let userLon = null;
    let rawHeading = 0;
    let smoothedHeading = 0;
    let lastTime = performance.now();
    let isGpsInitialized = false;
    
    const UNIFORM_COLOR = { r: 0, g: 255, b: 204 };
    const RED_COLOR = { r: 255, g: 40, b: 40 };
    let sources = [];

    const startBtn = document.getElementById('startBtn');
    const triggerBtn = document.getElementById('triggerBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');

    const countInput = document.getElementById('countInput');
    const sampleLengthInput = document.getElementById('sampleLengthInput');
    const fadeTimeInput = document.getElementById('fadeTimeInput');
    const pulseSpeedInput = document.getElementById('pulseSpeedInput');
    const spacingInput = document.getElementById('spacingInput');
    const thicknessInput = document.getElementById('thicknessInput');
    const exponentInput = document.getElementById('exponentInput');
    const speedInput = document.getElementById('speedInput');

    const countVal = document.getElementById('countVal');
    const sampleLengthVal = document.getElementById('sampleLengthVal');
    const fadeTimeVal = document.getElementById('fadeTimeVal');
    const pulseSpeedVal = document.getElementById('pulseSpeedVal');
    const spacingVal = document.getElementById('spacingVal');
    const thicknessVal = document.getElementById('thicknessVal');
    const exponentVal = document.getElementById('exponentVal');
    const speedVal = document.getElementById('speedVal');

    countInput.addEventListener('input', (e) => {
      config.sourceCount = parseInt(e.target.value);
      countVal.innerText = config.sourceCount;
      if (userLat !== null) generateSourcesFromCurrentLocation();
    });

    sampleLengthInput.addEventListener('input', (e) => {
      config.sampleLengthSec = parseFloat(e.target.value);
      sampleLengthVal.innerText = config.sampleLengthSec.toFixed(1) + 's';
    });

    fadeTimeInput.addEventListener('input', (e) => {
      config.fadeOutDurationSec = parseFloat(e.target.value);
      fadeTimeVal.innerText = config.fadeOutDurationSec.toFixed(1) + 's';
    });

    pulseSpeedInput.addEventListener('input', (e) => {
      config.pulseSpeed = parseFloat(e.target.value);
      pulseSpeedVal.innerText = config.pulseSpeed.toFixed(1);
    });

    spacingInput.addEventListener('input', (e) => {
      config.waveSpacing = parseFloat(e.target.value);
      spacingVal.innerText = config.waveSpacing + 'px';
    });

    thicknessInput.addEventListener('input', (e) => {
      config.strokeWidth = parseFloat(e.target.value);
      thicknessVal.innerText = config.strokeWidth.toFixed(1) + 'px';
    });

    exponentInput.addEventListener('input', (e) => {
      config.exponent = parseFloat(e.target.value);
      exponentVal.innerText = config.exponent.toFixed(1);
    });

    speedInput.addEventListener('input', (e) => {
      config.animSpeed = parseFloat(e.target.value);
      speedVal.innerText = config.animSpeed.toFixed(3);
    });

    const toggleControls = document.getElementById('toggleControls');
    const controlsBody = document.getElementById('controlsBody');
    const toggleIcon = document.getElementById('toggleIcon');
    let isOpen = true;

    toggleControls.addEventListener('click', () => {
      isOpen = !isOpen;
      controlsBody.style.display = isOpen ? 'block' : 'none';
      toggleIcon.innerText = isOpen ? '−' : '+';
    });

    startBtn.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          await DeviceOrientationEvent.requestPermission();
        } catch (e) { console.error(e); }
      }

      window.addEventListener('deviceorientation', handleOrientation);

      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          handleGpsUpdate, 
          (err) => { status.innerHTML = "GPS Fout: " + err.message; }, 
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      } else {
        status.innerHTML = "GPS niet ondersteund op dit apparaat.";
      }

      startBtn.style.display = 'none';
      triggerBtn.style.display = 'block';
      lastTime = performance.now();
      requestAnimationFrame(renderLoop);
    });

    triggerBtn.addEventListener('click', () => {
      if (sources[0] && !sources[0].isRespawning) {
        triggerSource(sources[0]);
      }
    });

    function triggerSource(source) {
      source.isTriggered = true;
      source.fadeOpacity = 1.0;
      source.playTimer = config.sampleLengthSec;
    }

    function handleGpsUpdate(position) {
      userLat = position.coords.latitude;
      userLon = position.coords.longitude;

      if (!isGpsInitialized) {
        generateSourcesFromCurrentLocation();
        isGpsInitialized = true;
      }

      updateSourcesPositions();
    }

    function generateSourcesFromCurrentLocation() {
      sources = [];
      const count = config.sourceCount;
      const step = 360 / count;

      for (let i = 0; i < count; i++) {
        const initialDistMeters = 25 + (i * 10);
        const bearingDeg = (i * step) % 360;

        const targetCoords = calculateTargetCoords(userLat, userLon, initialDistMeters, bearingDeg);

        sources.push({
          lat: targetCoords.lat,
          lon: targetCoords.lon,
          dist: initialDistMeters,
          bearing: bearingDeg,
          isTriggered: false,
          fadeOpacity: 1.0,
          playTimer: 0,
          isRespawning: false
        });
      }
    }

    function updateSourcesPositions() {
      if (userLat === null || userLon === null) return;

      sources.forEach((source) => {
        source.dist = getHaversineDistance(userLat, userLon, source.lat, source.lon);
        source.bearing = getBearing(userLat, userLon, source.lat, source.lon);

        if (source.dist <= 5 && !source.isTriggered && !source.isRespawning) {
          triggerSource(source);
        }
      });
    }

    function respawnSource(index) {
      if (!sources[index]) return;

      sources[index].isRespawning = true;

      setTimeout(() => {
        if (userLat !== null && userLon !== null) {
          const newDist = 25 + Math.floor(Math.random() * 30);
          const newBearing = Math.floor(Math.random() * 360);
          const newCoords = calculateTargetCoords(userLat, userLon, newDist, newBearing);

          sources[index].lat = newCoords.lat;
          sources[index].lon = newCoords.lon;
          sources[index].dist = newDist;
          sources[index].bearing = newBearing;
        }

        sources[index].isTriggered = false;
        sources[index].fadeOpacity = 1.0;
        sources[index].playTimer = 0;
        sources[index].isRespawning = false;
      }, 1000);
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        rawHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        rawHeading = 360 - event.alpha;
      }
    }

    let animStep = 0;

    function renderLoop(currentTime) {
      const deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const center = 200;
      const compassRadius = 195;

      ctx.save();
      ctx.beginPath();
      ctx.arc(center, center, compassRadius, 0, Math.PI * 2);
      ctx.clip();

      let diff = rawHeading - smoothedHeading;
      diff = Math.atan2(Math.sin(diff * Math.PI / 180), Math.cos(diff * Math.PI / 180)) * 180 / Math.PI;
      smoothedHeading += diff * 0.12;
      smoothedHeading = (smoothedHeading + 360) % 360;

      animStep += config.animSpeed;

      let statusText = userLat === null ? "GPS zoeken... | " : "";

      sources.forEach((source, i) => {
        if (source.isTriggered) {
          if (source.playTimer > 0) {
            source.playTimer -= deltaTime;
          } else if (source.fadeOpacity > 0) {
            source.fadeOpacity -= deltaTime / config.fadeOutDurationSec;
            if (source.fadeOpacity <= 0) {
              source.fadeOpacity = 0;
              if (!source.isRespawning) {
                respawnSource(i);
              }
            }
          }
        }

        let bearingDiff = source.bearing - smoothedHeading;
        bearingDiff = Math.atan2(Math.sin(bearingDiff * Math.PI / 180), Math.cos(bearingDiff * Math.PI / 180)) * 180 / Math.PI;

        if (source.fadeOpacity > 0 && !source.isRespawning) {
          drawBoundaryWaveCircles(ctx, bearingDiff, source.dist, center, compassRadius, source, currentTime);
        }

        if (i < 4) {
          let state = "";
          if (source.isRespawning) {
            state = ` [HERLADEN...]`;
          } else if (source.isTriggered) {
            if (source.playTimer > 0) {
              state = ` [LIVE: ${source.playTimer.toFixed(1)}s]`;
            } else {
              const pct = Math.round(source.fadeOpacity * 100);
              state = ` [FADE: ${pct}%]`;
            }
          }
          statusText += `B${i+1}: ${Math.round(source.dist)}m${state} | `;
        }
      });

      if (sources.length > 4) statusText += `+${sources.length - 4} extra`;
      status.innerHTML = statusText;

      ctx.restore();

      ctx.save();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(center, center, compassRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      requestAnimationFrame(renderLoop);
    }

    function drawBoundaryWaveCircles(ctx, angleDeg, distanceMeters, center, compassRadius, sourceData, currentTime) {
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(angleDeg * Math.PI / 180);

      const sourceY = -compassRadius - Math.max(10, distanceMeters * 2.5);
      const waveSpacing = config.waveSpacing; 
      const numWaves = 35;
      const timeOffset = (animStep) % waveSpacing;
      const maxSourceReach = 1000; 

      const currentColor = sourceData.isTriggered ? RED_COLOR : UNIFORM_COLOR;
      const t = currentTime * 0.001 * config.pulseSpeed;

      for (let r = 0; r < numWaves; r++) {
        const radius = Math.abs(sourceY) - compassRadius + (r * waveSpacing) + timeOffset;

        const progressFromSource = Math.max(0.0, 1.0 - (radius / maxSourceReach));
        const densityFactor = Math.max(0.4, 1.2 - (config.sourceCount * 0.08));
        
        let alpha = Math.min(1.0, Math.max(0.02, Math.pow(progressFromSource, config.exponent) * densityFactor)); 

        // Vloeiende organische rimpeling in helderheid tijdens afspelen én fade out
        if (sourceData.isTriggered) {
          const wavePulse = 0.65 + 0.35 * (
            Math.sin(t - r * 0.3) * 0.6 + 
            Math.sin(t * 1.7 + r * 0.1) * 0.4
          );
          alpha *= wavePulse;
        }

        alpha *= sourceData.fadeOpacity;

        ctx.lineWidth = sourceData.isTriggered ? config.strokeWidth + 0.8 : config.strokeWidth;
        ctx.strokeStyle = `rgba(${currentColor.r}, ${currentColor.g}, ${currentColor.b}, ${alpha})`;

        ctx.beginPath();
        ctx.arc(0, sourceY, Math.max(1, radius), 0, Math.PI * 2, false);
        ctx.stroke();
      }

      ctx.restore();
    }

    // --- WISKUNDIGE GPS FUNCTIES ---

    function getHaversineDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function calculateTargetCoords(lat, lon, distanceMeters, bearingDeg) {
      const R = 6371000;
      const δ = distanceMeters / R;
      const θ = bearingDeg * Math.PI / 180;
      const φ1 = lat * Math.PI / 180;
      const λ1 = lon * Math.PI / 180;

      const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
      const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));

      return {
        lat: φ2 * 180 / Math.PI,
        lon: λ2 * 180 / Math.PI
      };
    }
  </script>
</body>
</html>
