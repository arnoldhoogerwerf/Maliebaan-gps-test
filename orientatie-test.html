<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Full-Screen Moiré Interferentiemeter</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      background-color: #050505;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      font-size: 13px;
      color: #ccc;
      text-align: center;
      padding: 0 20px;
      line-height: 1.4;
      z-index: 10;
      pointer-events: none;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 40px;
      z-index: 20;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
      cursor: pointer;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="status">Druk op start om GPS & Kompas te activeren.</div>
  <button id="startBtn">Start Ervaring</button>

  <canvas id="compassCanvas"></canvas>

  <script>
    let userCoords = null;
    let targetLocations = [];

    // Smoothing & Sensoren
    let rawHeading = 0;
    let smoothedHeading = 0;
    
    // Heldere, opvallende kleuren voor maximale Moiré-interferentie
    let arrowData = [
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0, color: '#00ffcc' },
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0, color: '#ff0055' },
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0, color: '#ffcc00' }
    ];

    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY, maxRadius;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      centerX = width / 2;
      centerY = height / 2;
      // Diagonale straal om het hele scherm ruim te bedekken
      maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    startBtn.addEventListener('click', async () => {
      // 1. iOS Kompas Toestemming
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            status.innerText = "Kompas-toestemming geweigerd.";
            return;
          }
        } catch (e) { console.error(e); }
      }

      // 2. Sensor Event Listeners
      window.addEventListener('deviceorientation', handleOrientation);

      if ("geolocation" in navigator) {
        status.innerText = "GPS zoeken...";
        navigator.geolocation.watchPosition(updatePosition, handleError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      } else {
        status.innerText = "Geen GPS ondersteuning.";
      }

      startBtn.style.display = 'none';

      // Start 60fps animatie loop
      requestAnimationFrame(renderLoop);
    });

    function updatePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!userCoords) {
        userCoords = { lat, lng };
        generateTargetLocations(lat, lng);
      } else {
        // Sterke low-pass filter op GPS tegen positie-jitter
        userCoords.lat = userCoords.lat * 0.8 + lat * 0.2;
        userCoords.lng = userCoords.lng * 0.8 + lng * 0.2;
      }

      calculateTargets();
    }

    function handleError(err) {
      status.innerText = "GPS Fout: " + err.message;
    }

    function generateTargetLocations(lat, lng) {
      targetLocations = [];
      const distances = [40, 90, 150]; // Bronnen op 40m, 90m en 150m afstand
      for (let i = 0; i < 3; i++) {
        const angle = (i * 120) + (Math.random() * 30);
        const distanceInMeters = distances[i];
        
        const deltaLat = (distanceInMeters / 111111) * Math.cos(angle * Math.PI / 180);
        const deltaLng = (distanceInMeters / (111111 * Math.cos(lat * Math.PI / 180))) * Math.sin(angle * Math.PI / 180);

        targetLocations.push({ lat: lat + deltaLat, lng: lng + deltaLng });
      }
    }

    function calculateTargets() {
      if (!userCoords || targetLocations.length === 0) return;

      targetLocations.forEach((target, i) => {
        arrowData[i].targetDist = getDistance(userCoords.lat, userCoords.lng, target.lat, target.lng);
        arrowData[i].bearing = getBearing(userCoords.lat, userCoords.lng, target.lat, target.lng);
      });
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        rawHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        rawHeading = 360 - event.alpha;
      }
    }

    let waveAnimTime = 0;

    function renderLoop() {
      // Clear Scherm
      ctx.clearRect(0, 0, width, height);

      // 1. Extra sterke Kompas Smoothing tegen trillingen
      let diff = rawHeading - smoothedHeading;
      diff = Math.atan2(Math.sin(diff * Math.PI / 180), Math.cos(diff * Math.PI / 180)) * 180 / Math.PI;
      smoothedHeading += diff * 0.05; // Rustigere lerp
      smoothedHeading = (smoothedHeading + 360) % 360;

      // Rustige constante animatiesnelheid voor de golf-rimpeling
      waveAnimTime += 0.15;

      if (userCoords && targetLocations.length > 0) {
        let statusText = "";

        targetLocations.forEach((target, i) => {
          // Smooth Afstand
          arrowData[i].currentDist += (arrowData[i].targetDist - arrowData[i].currentDist) * 0.03;
          const dist = arrowData[i].currentDist;

          // Smooth Rotatie van de bron
          const targetAngle = arrowData[i].bearing - smoothedHeading;
          let angleDiff = targetAngle - arrowData[i].currentAngle;
          angleDiff = Math.atan2(Math.sin(angleDiff * Math.PI / 180), Math.cos(angleDiff * Math.PI / 180)) * 180 / Math.PI;
          arrowData[i].currentAngle += angleDiff * 0.08; // Rustigere rotatie-lerp

          // Teken de scherpe schermvullende Moiré-golffronten
          drawFullScreenWaveFront(ctx, arrowData[i].currentAngle, dist, arrowData[i].color, i);

          statusText += `Bron ${i+1}: ${Math.round(dist)}m | `;
        });

        status.innerText = statusText.slice(0, -3);
      }

      requestAnimationFrame(renderLoop);
    }

    function drawFullScreenWaveFront(ctx, angleDeg, distanceMeters, color, index) {
      ctx.save();
      
      // Verplaats de oorsprong naar het exacte midden van het scherm
      ctx.translate(centerX, centerY);
      ctx.rotate(angleDeg * Math.PI / 180);
      
      // Bron staat ver buiten het scherm gepositioneerd
      const sourceY = -(maxRadius + 150 + (distanceMeters * 1.5));

      // Dichtheid van de lijnen (waveSpacing)
      // Dichterbij = fijnmaziger Moiré-patroon
      const minSpacing = 2.8; 
      const maxSpacing = 8.0;
      const waveSpacing = Math.max(minSpacing, Math.min(maxSpacing, (distanceMeters / 150) * maxSpacing));

      ctx.strokeStyle = color;
      ctx.lineWidth = 1.0; // Scherpe, heldere lijnen

      // Aantal golflijnen om het gehele scherm te doorkruisen
      const totalSpan = maxRadius * 2 + 300;
      const numWaves = Math.ceil(totalSpan / waveSpacing); 
      const timeOffset = (waveAnimTime + index * 40) % waveSpacing; 

      const minRadiusNeeded = Math.abs(sourceY) - maxRadius;
      const maxRadiusNeeded = Math.abs(sourceY) + maxRadius;

      for (let r = 0; r < numWaves; r++) {
        const radius = (r * waveSpacing) + timeOffset;
        
        // Alleen bogen tekenen die binnen het zichtbare scherm vallen
        if (radius >= minRadiusNeeded && radius <= maxRadiusNeeded) {
          
          // Hoge basistransparantie zodat kleuren OOK op grote afstand helder blijven
          ctx.globalAlpha = 0.75; 

          ctx.beginPath();
          // Grote bogen vanuit de externe bron die over het hele scherm vloeien
          ctx.arc(0, sourceY, radius, Math.PI * 0.3, Math.PI * 0.7, false);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // Wiskundige functies
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
  </script>
</body>
</html>
