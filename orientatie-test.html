<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Moiré Golffronten Kompas Demo</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 20px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      padding: 0 20px;
      line-height: 1.4;
      z-index: 10;
    }

    button {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      z-index: 20;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
      cursor: pointer;
    }

    #canvas-container {
      position: relative;
      width: 320px;
      height: 320px;
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div id="status">Druk op start om GPS & Kompas te activeren.</div>
  <button id="startBtn">Start Ervaring</button>

  <div id="canvas-container">
    <canvas id="compassCanvas" width="320" height="320"></canvas>
  </div>

  <script>
    let userCoords = null;
    let targetLocations = [];

    // Smoothing & Sensoren
    let rawHeading = 0;
    let smoothedHeading = 0;
    let arrowData = [
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0, color: '#00ffcc' },
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0, color: '#ff0055' },
      { currentAngle: 0, currentDist: 0, targetDist: 0, bearing: 0, color: '#ffcc00' }
    ];

    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const canvas = document.getElementById('compassCanvas');
    const ctx = canvas.getContext('2d');

    startBtn.addEventListener('click', async () => {
      // 1. iOS Kompas Toestemming
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') {
            status.innerText = "Kompas-toestemming geweigerd.";
            return;
          }
        } catch (e) { console.error(e); }
      }

      // 2. Sensor Event Listeners
      window.addEventListener('deviceorientation', handleOrientation);

      if ("geolocation" in navigator) {
        status.innerText = "GPS zoeken...";
        navigator.geolocation.watchPosition(updatePosition, handleError, {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        });
      } else {
        status.innerText = "Geen GPS ondersteuning.";
      }

      startBtn.style.display = 'none';

      // Start 60fps animatie loop
      requestAnimationFrame(renderLoop);
    });

    function updatePosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!userCoords) {
        userCoords = { lat, lng };
        generateTargetLocations(lat, lng);
      } else {
        // Low-pass filter op GPS
        userCoords.lat = userCoords.lat * 0.7 + lat * 0.3;
        userCoords.lng = userCoords.lng * 0.7 + lng * 0.3;
      }

      calculateTargets();
    }

    function handleError(err) {
      status.innerText = "GPS Fout: " + err.message;
    }

    function generateTargetLocations(lat, lng) {
      targetLocations = [];
      const distances = [40, 90, 140]; // Punten op 40m, 90m en 140m afstand
      for (let i = 0; i < 3; i++) {
        const angle = (i * 120) + (Math.random() * 30);
        const distanceInMeters = distances[i];
        
        const deltaLat = (distanceInMeters / 111111) * Math.cos(angle * Math.PI / 180);
        const deltaLng = (distanceInMeters / (111111 * Math.cos(lat * Math.PI / 180))) * Math.sin(angle * Math.PI / 180);

        targetLocations.push({ lat: lat + deltaLat, lng: lng + deltaLng });
      }
    }

    function calculateTargets() {
      if (!userCoords || targetLocations.length === 0) return;

      targetLocations.forEach((target, i) => {
        arrowData[i].targetDist = getDistance(userCoords.lat, userCoords.lng, target.lat, target.lng);
        arrowData[i].bearing = getBearing(userCoords.lat, userCoords.lng, target.lat, target.lng);
      });
    }

    function handleOrientation(event) {
      if (event.webkitCompassHeading) {
        rawHeading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        rawHeading = 360 - event.alpha;
      }
    }

    function renderLoop() {
      // Clear Canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Teken buitenrand kompas
      ctx.save();
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(160, 160, 150, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // 1. Smooth Kompas Heading
      let diff = rawHeading - smoothedHeading;
      diff = Math.atan2(Math.sin(diff * Math.PI / 180), Math.cos(diff * Math.PI / 180)) * 180 / Math.PI;
      smoothedHeading += diff * 0.1;
      smoothedHeading = (smoothedHeading + 360) % 360;

      if (userCoords && targetLocations.length > 0) {
        let statusText = "";

        targetLocations.forEach((target, i) => {
          // Smooth Afstand
          arrowData[i].currentDist += (arrowData[i].targetDist - arrowData[i].currentDist) * 0.05;
          const dist = arrowData[i].currentDist;

          // Smooth Rotatie van de bron richting (met atan2 fix)
          const targetAngle = arrowData[i].bearing - smoothedHeading;
          let angleDiff = targetAngle - arrowData[i].currentAngle;
          angleDiff = Math.atan2(Math.sin(angleDiff * Math.PI / 180), Math.cos(angleDiff * Math.PI / 180)) * 180 / Math.PI;
          arrowData[i].currentAngle += angleDiff * 0.15;

          // Teken de Moiré Golfbron op het canvas
          drawWaveSource(ctx, arrowData[i].currentAngle, dist, arrowData[i].color, i);

          statusText += `Bron ${i+1}: ${Math.round(dist)}m | `;
        });

        status.innerText = statusText.slice(0, -3);
      }

      requestAnimationFrame(renderLoop);
    }

    function drawWaveSource(ctx, angleDeg, distanceMeters, color, index) {
      ctx.save();
      
      // Verplaats de oorsprong naar het centrum van het canvas (160, 160)
      ctx.translate(160, 160);
      
      // Draai naar de hoek van de bron
      ctx.rotate(angleDeg * Math.PI / 180);
      
      // Schaal de afstand van de bron naar het canvas (30px tot 130px vanaf het midden)
      const renderDist = Math.max(30, Math.min(130, (distanceMeters / 150) * 130));
      const sourceY = -renderDist; // Voren op canvas is negatieve Y

      ctx.strokeStyle = color;
      ctx.lineWidth = 1.2;

      // 8 tot 12 dunne golfbogen per bron
      const numWaves = 10;
      const waveSpacing = 7; // Afstand tussen golflijnen
      
      // Tijdsvariabele voor continue rimpeling van binnen naar buiten
      const timeOffset = (Date.now() / 40 + index * 100) % waveSpacing; 

      for (let r = 0; r < numWaves; r++) {
        const radius = (r * waveSpacing) + timeOffset;
        
        // Transparantie neemt af naarmate de golf verder beweegt
        const alpha = Math.max(0, 0.8 - (radius / (numWaves * waveSpacing)));
        ctx.globalAlpha = alpha;

        ctx.beginPath();
        // Teken een cirkelboog gericht naar de gebruiker toe om interferentie te veroorzaken
        ctx.arc(0, sourceY, radius, 0, Math.PI * 2, false);
        ctx.stroke();
      }

      // Teken klein doellabel boven de bron
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = color;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${Math.round(distanceMeters)}m`, 0, sourceY - 12);

      ctx.restore();
    }

    // Wiskundige functies
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3; 
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }
  </script>
</body>
</html>
